name: Quality

on:
  merge_group:
  pull_request:
    branches: [ main ]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: |
          npm pkg delete scripts.prepare
          npm ci

      - name: Run JS and linter
        run: |
          npm run eslint
